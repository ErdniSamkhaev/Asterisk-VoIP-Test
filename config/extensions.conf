; Internal calling, IVR, call-center queue, support and lab provider routes.
[from-internal]
exten => _3XXX,1,NoOp(Internal call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

exten => 2000,1,Goto(ivr-main,s,1)
; Internal lab entry for testing support routing before the provider trunk.
exten => 2001,1,Goto(tp-entry,s,1)

; Exact service extensions and _3XXX take precedence over these patterns.
exten => _X.,1,Set(OUT_NUMBER=${EXTEN})
 same => n,Goto(to-provider,s,1)
exten => _+X.,1,Set(OUT_NUMBER=${EXTEN:1})
 same => n,Goto(to-provider,s,1)

[ivr-main]
exten => s,1,Answer()
 same => n,Set(IVR_TRIES=0)
 same => n,Set(TIMEOUT(digit)=3)
 same => n,Set(TIMEOUT(response)=5)
 same => n(menu),BackGround(custom/ivr-welcome)
 same => n,WaitExten(5)
 same => n,Goto(cc-entry,s,1)

exten => _3XXX,1,NoOp(IVR extension ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done)
 same => n,Goto(cc-entry,s,1)
 same => n(done),Hangup()

exten => t,1,Goto(cc-entry,s,1)

exten => i,1,Set(IVR_TRIES=$[${IVR_TRIES}+1])
 same => n,GotoIf($[${IVR_TRIES}>=2]?cc-entry,s,1)
 same => n,Playback(custom/ivr-invalid)
 same => n,Goto(s,menu)

[cc-entry]
exten => s,1,NoOp(Call-center queue entry)
 same => n,Answer()
 same => n,Queue(cc,,,,60)
 same => n,NoOp(Queue result ${QUEUESTATUS})
 same => n,Playback(custom/ivr-unavailable)
 same => n,Hangup()

[tp-entry]
exten => s,1,NoOp(Random registered technical-support employee)
 same => n,Answer()
 same => n,Set(TP_SNAPSHOT=${DB(tp/snapshot)})
 same => n,GotoIf($["${TP_SNAPSHOT}"=""]?unavailable)
 same => n,Set(TP_STAMP=${CUT(TP_SNAPSHOT,|,1)})
 same => n,GotoIf($[${REGEX("^[0-9]+$" ${TP_STAMP})}=0]?unavailable)
 same => n,Set(TP_AGE=$[${EPOCH}-${TP_STAMP}])
 same => n,GotoIf($[${TP_AGE}<0]?unavailable)
 same => n,GotoIf($[${TP_AGE}>60]?unavailable)
 same => n,Set(TP_LIST=${CUT(TP_SNAPSHOT,|,2)})
 same => n,GotoIf($[${REGEX("^34[0-9][0-9](,34[0-9][0-9])*$" ${TP_LIST})}=0]?unavailable)
 same => n,Set(TP_COUNT=${FIELDQTY(TP_LIST,\x2C)})
 same => n,Set(TP_INDEX=${RAND(1,${TP_COUNT})})
 same => n,Set(TP_WORK=${TP_LIST})
 same => n,While($[${TP_INDEX}>1])
 same => n,Set(TP_SKIP=${SHIFT(TP_WORK)})
 same => n,Set(TP_INDEX=$[${TP_INDEX}-1])
 same => n,EndWhile()
 same => n,Set(TP_NUMBER=${SHIFT(TP_WORK)})
 same => n,Set(TP_DIAL=${PJSIP_DIAL_CONTACTS(${TP_NUMBER})})
 same => n,GotoIf($["${TP_DIAL}"=""]?unavailable)
 same => n,NoOp(TP selected ${TP_NUMBER} snapshot-age ${TP_AGE})
 same => n,Dial(${TP_DIAL},20)
 same => n,NoOp(TP call result ${DIALSTATUS})
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done)
 same => n(unavailable),Playback(custom/ivr-unavailable)
 same => n(done),Hangup()

[from-provider]
; Main DID and the other general DIDs enter the IVR.
exten => _7499000000X,1,NoOp(Inbound lab DID ${EXTEN})
 same => n,Gosub(copy-provider-headers,s,1)
 same => n,Goto(ivr-main,s,1)
; Specific support-DID requirement takes priority over the general IVR rule.
exten => 74990000010,1,Goto(tp-entry,s,1)

[to-provider]
exten => s,1,NoOp(Outbound lab-provider call)
 same => n,GotoIf($[${REGEX("^[0-9]+$" ${OUT_NUMBER})}=0]?invalid)
 same => n,GotoIf($[${LEN(${OUT_NUMBER})}<2]?invalid)
 same => n,GotoIf($[${LEN(${OUT_NUMBER})}>15]?invalid)
 same => n,NoOp(Outbound number ${OUT_NUMBER})
 same => n,Dial(PJSIP/${OUT_NUMBER}@lab-provider,30)
 same => n,Hangup()
 same => n(invalid),Hangup(28)

[copy-provider-headers]
; Asterisk 22.9+; copy the first instance of each incoming X-* header.
exten => s,1,Set(FWD_HEADER_LIST=${PJSIP_HEADERS(X-)})
 same => n,While($["${FWD_HEADER_LIST}"!=""])
 same => n,Set(FWD_HEADER_NAME=${SHIFT(FWD_HEADER_LIST)})
 same => n,Set(FWD_HEADER_VALUE=${PJSIP_HEADER(read,${FWD_HEADER_NAME},1)})
 same => n,Set(PJSIP_INHERITABLE_HEADER(add,${FWD_HEADER_NAME})=${FWD_HEADER_VALUE})
 same => n,NoOp(Inheriting inbound SIP header ${FWD_HEADER_NAME})
 same => n,EndWhile()
 same => n,Return()
