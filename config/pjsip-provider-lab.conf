; IP-authenticated lab trunk to SIPp on the same VPS.
[lab-provider]
type=endpoint
transport=transport-udp
context=from-provider
identify_by=ip
disallow=all
allow=alaw,ulaw
direct_media=no
dtmf_mode=rfc4733
timers=no
aors=lab-provider

[lab-provider]
type=aor
contact=sip:127.0.0.1:5062
qualify_frequency=0

[lab-provider-identify]
type=identify
endpoint=lab-provider
match=127.0.0.1:5062
