; Initial test phones. Authentication objects are defined separately.
[phone-endpoint](!)
type=endpoint
transport=transport-udp
context=from-internal
disallow=all
allow=alaw,ulaw
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
dtmf_mode=rfc4733

[phone-aor](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

[3000](phone-endpoint)
auth=auth3000
aors=3000
callerid=Employee 3000 <3000>

[3000](phone-aor)

[3001](phone-endpoint)
auth=auth3001
aors=3001
callerid=Employee 3001 <3001>

[3001](phone-aor)
