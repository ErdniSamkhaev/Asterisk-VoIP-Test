; Module loading policy for the Asterisk/PJSIP test lab.
[modules]
autoload=yes

; These components must load successfully for the lab to start.
require=res_pjsip.so
require=chan_pjsip.so
require=app_queue.so
require=res_pjsip_header_funcs.so

; RADIUS accounting is outside the scope of this lab.
noload=cdr_radius.so
noload=cel_radius.so

; HEP monitoring is not used.
noload=res_hep.so
noload=res_hep_pjsip.so
noload=res_hep_rtcp.so

; Preserve the exclusions for alternative voicemail implementations.
noload=app_voicemail_imap.so
noload=app_voicemail_odbc.so
